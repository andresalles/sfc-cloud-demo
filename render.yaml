# Render.com Configuration - SFC Cloud Edition
# Deploy automático para demonstração TECPAR

services:
  - type: web
    name: sfc-cloud-tecpar
    env: python
    plan: free
    branch: main
    
    # Build Configuration
    buildCommand: pip install -r requirements_cloud.txt
    
    # Start Command  
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false

    # Health Check Path
    healthCheckPath: /_stcore/health
    
    # Auto-Deploy
    autoDeploy: true